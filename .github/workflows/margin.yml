name: 【margin.yml】Margin Info Fetch

on:
  schedule:
    - cron: "7 18 * * *"   # JST 3:07（UTC 18:07）
  workflow_dispatch:

permissions:
  contents: write

# 複数のworkflowの同時実行を禁止
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  fetch-margin-info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← stale info（古い main）を防ぐため必須

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm install --no-save node-fetch@3 xlsx jsdom pdfjs-dist iconv-lite

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Run margin.js
        run: node scripts/margin.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/margin.json data/backup/

          git commit -m "Auto-update margin.json + backup" || exit 0

          git push origin main || (
            echo "Push rejected. Fetching latest main..."

            echo "=== Git status ==="
            git status

            echo "=== HEAD ==="
            git rev-parse HEAD

            echo "=== origin/main ==="
            git ls-remote origin refs/heads/main

            echo "=== Recent commits ==="
            git log --oneline --decorate -5

            git fetch origin
            git rebase -X theirs origin/main
            git push origin main
          )
