name: 【margin.yml】Margin Info Fetch

# 実行時刻について（2026-0X 見直し／2026-09-28 JPX集計システムリプレース対応で更新）：
# 参照する信用取引データの公表時刻は JPX 公式ページに明記されている
# （scripts/margin.js が実際に読みにいくページの本文より）。
#   - JPX 日々公表銘柄等信用取引残高（旧称：個別銘柄信用取引残高表）:
#     毎営業日16:00を目安に掲載
#     https://www.jpx.co.jp/markets/statistics-equities/margin/index.html
#   - JPX 銘柄別信用取引残高（旧称：銘柄別信用取引週末残高。2026-09-28のJPX
#     集計システムリプレースにより、週次(火曜16:30)から毎営業日16:00へ変更。
#     掲載ページも 05.html → 01.html へ移動）
#     https://www.jpx.co.jp/markets/statistics-equities/margin/01.html
#     詳細: https://www.jpx.co.jp/news/1032/20260927-01.html
#   - JSF（日本証券金融）貸借取引残高: 18時半過ぎに速報値を更新
#     （参考。meigara.csv自体の公表時刻は不明）
# 上記の通り、リプレース後も全ソースの公表時刻は変わらず19:07 JSTより前で
# あるため、本ワークフローの実行時刻自体は変更していない（当日中2回実行の
# 安全網構成も踏襲）。
#
# 注意：2回とも「同じJST暦日」に収める必要がある。writeMarginArchive() の
# 「当日分ファイルが既に存在すればスキップ」判定は scripts/lib/jst_time.js
# 経由の実行時点JST暦日で行われるため、日付をまたぐ実行にしてしまうと
# 「再試行」ではなく「別日付エントリの重複生成」になってしまう
# （旧スケジュールの JST 3:07＝翌日未明は、この理由により廃止した）。
on:
  schedule:
    - cron: "7 10 * * *"   # JST 19:07（公表完了後・1回目）
    - cron: "7 13 * * *"   # JST 22:07（1回目失敗時の再試行・同日中）
  workflow_dispatch:

permissions:
  contents: write

# 複数のworkflowの同時実行を禁止
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  fetch-margin-info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← stale info（古い main）を防ぐため必須

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm install --no-save node-fetch@3 xlsx jsdom pdfjs-dist iconv-lite

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Run margin.js
        run: node scripts/margin.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/margin/

          git commit -m "Auto-update margin_archive" || exit 0

          git push origin main || (
            echo "Push rejected. Fetching latest main..."

            echo "=== Git status ==="
            git status

            echo "=== HEAD ==="
            git rev-parse HEAD

            echo "=== origin/main ==="
            git ls-remote origin refs/heads/main

            echo "=== Recent commits ==="
            git log --oneline --decorate -5

            git fetch origin
            git rebase -X theirs origin/main
            git push origin main
          )
