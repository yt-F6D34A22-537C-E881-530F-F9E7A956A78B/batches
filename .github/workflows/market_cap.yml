name: 【market_cap.yml】Fetch Market Cap Data

# 発行済株式数（時価総額の算出に用いる市場データ）の更新。株式分割・
# 自己株買い等がない限り短期間ではほぼ変化しないため、data.json（日次・
# fetch.yml）や margin.json（margin.yml）ほど高頻度な更新は不要と判断し、
# 週次（毎週日曜 21:00 UTC＝日本時間 月曜 6:00）に設定している。
# 2026-07 新設（時価総額列の追加に伴う）。fetch.yml の構成に合わせている。
on:
  schedule:
    - cron: "0 21 * * 0"  # JST 月曜 06:00（UTC 日曜 21:00）
  workflow_dispatch:

permissions:
  contents: write

# 複数のworkflowの同時実行を禁止（fetch.yml/margin.yml等と同じ
# concurrency.group を共有し、data/ 配下への同時コミット・pushによる
# 競合を避ける。2026-07、market_cap.yml もこの共有グループへ加えた）
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  fetch_market_cap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← stale info（古い main）を防ぐため必須

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-save node-fetch@3 xlsx

      - name: Ensure data directory exists
        run: |
          mkdir -p data

      - name: Run fetch script
        run: node scripts/fetch_market_cap.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/market_cap.json

          git commit -m "Update market_cap.json" || exit 0

          git push origin main || (
            echo "Push rejected. Fetching latest main..."

            echo "=== Git status ==="
            git status

            echo "=== HEAD ==="
            git rev-parse HEAD

            echo "=== origin/main ==="
            git ls-remote origin refs/heads/main

            echo "=== Recent commits ==="
            git log --oneline --decorate -5

            git fetch origin
            git rebase -X theirs origin/main
            git push origin main
          )
