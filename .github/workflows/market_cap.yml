name: 【market_cap.yml】Fetch Market Cap Data

# 発行済株式数（時価総額算出用の市場データ）の更新。株式分割・自己株買い等が
# ない限り短期間ではほぼ変化しないため、data.json（1日4回更新）ほど高頻度な
# 更新は不要と判断し、週次（毎週日曜 21:00 UTC＝日本時間 月曜 6:00）に設定
# している。2026-07 新設（時価総額列の追加に伴う）。fetch.yml と処理フロー・
# 方式（checkout・Node.jsセットアップ・依存インストール・push再試行）を統一した。
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# fetch.yml・margin.yml 等の既存ワークフローと同じ concurrency.group を共有し、
# data/ 配下への同時書き込み・push衝突を防ぐ（2026-07、market_cap 専用の
# グループから auto-update への変更。他ワークフローとの整合を優先した）。
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  fetch_market_cap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← stale info（古い main）を防ぐため必須

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-save node-fetch@3 xlsx

      - name: Ensure data directory exists
        run: |
          mkdir -p data

      - name: Run fetch script
        run: node scripts/fetch_market_cap.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/market_cap.json

          git commit -m "Update market_cap.json" || exit 0

          git push origin main || (
            echo "Push rejected. Fetching latest main..."

            echo "=== Git status ==="
            git status

            echo "=== HEAD ==="
            git rev-parse HEAD

            echo "=== origin/main ==="
            git ls-remote origin refs/heads/main

            echo "=== Recent commits ==="
            git log --oneline --decorate -5

            git fetch origin
            git rebase -X theirs origin/main
            git push origin main
          )
