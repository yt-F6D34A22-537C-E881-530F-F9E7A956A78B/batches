name: 【simulate_trades.yml】Run heuristics signal trade simulation (経験則シグナル売買シミュレーション)

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: '対象期間の開始日（YYYYMMDD）。空欄なら全期間を対象とする'
        required: false
        default: ''
      to_date:
        description: '対象期間の終了日（YYYYMMDD）。空欄なら全期間を対象とする'
        required: false
        default: ''

permissions:
  contents: read  # 結果はartifactとしてのみ出力し、dataやanalysis配下へのcommit・pushは行わない

concurrency:
  group: heuristics-analysis  # analysis.ymlと同じグループを共有する（本ワークフローも内部でrun_all.pyを
  cancel-in-progress: false   # 実行するため、重い分析ジョブ同士が同時に走らないようにするための意図的な共有）

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # data/ohlcv・data/heuristics の現時点の内容が読めればよく、履歴は不要

      # [2026-08追加] heuristicsスコア計算ロジック（app/heuristics_scoring.py・
      # app/heuristics_scoring_rules.py）は別リポジトリ（webapp-backend）にあるため、
      # simulate_trades_by_score.py がそのままimportできるよう、ここでcheckoutして
      # webapp-backend/ 配下に配置する。webapp-backendは公開リポジトリのため、
      # 追加のアクセストークンは不要（デフォルトのcheckout権限で取得できる）。
      # ロジックを複製（vendoring）せず直接参照することで、webapp-backend側の
      # スコア定義変更が自動的にバックテストへ反映される（同期忘れによる乖離を防ぐ）。
      - name: Checkout webapp-backend (heuristics scoring source)
        uses: actions/checkout@v4
        with:
          repository: yt-F6D34A22-537C-E881-530F-F9E7A956A78B/webapp-backend
          path: webapp-backend
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: pip install -r analysis/requirements.txt

      # simulate_trades.py は result_all.csv / result_combinations.csv（verdict列付き）を前提とするが、
      # これらは data/ 同様、リポジトリへはcommitされない（読み取り専用ワークフローの方針のため）。
      # そのため、別ワークフロー実行のartifactを取得するのではなく、同一ジョブ内で run_all.py を
      # 先に実行して候補ルールを都度算出する（from_date/to_dateが異なる古いartifactを誤って
      # 参照してしまうと、シミュレーション対象ルールの一貫性・再現性が損なわれるため。2026-07）。
      - name: Run pooled/daywise/combination analysis (simulate_trades.py の前提データを生成)
        env:
          ANALYSIS_FROM_DATE: ${{ github.event.inputs.from_date }}
          ANALYSIS_TO_DATE: ${{ github.event.inputs.to_date }}
        run: |
          set -o pipefail
          mkdir -p analysis/output
          python -u analysis/run_all.py | tee analysis/output/run_log.txt

      # -u（無バッファ出力）を指定し、キャンセル・タイムアウト発生時にログが欠落しないようにする
      # （2026-07、組み合わせ検定のCIタイムアウト調査の際、バッファリングにより直前の進捗が
      #   ログに残らなかった教訓を踏まえた対応）。
      - name: Run trade simulation
        env:
          ANALYSIS_FROM_DATE: ${{ github.event.inputs.from_date }}
          ANALYSIS_TO_DATE: ${{ github.event.inputs.to_date }}
        run: |
          set -o pipefail
          python -u analysis/simulate_trades.py | tee analysis/output/simulate_trades_log.txt

      # rank_stocks_by_strategy.py は result_trade_simulation_best.csv（直前のステップで生成）を
      # 前提とするため、同一ジョブ内で simulate_trades.py の直後に実行する（2026-07追加）。
      - name: Run stock ranking by strategy
        env:
          ANALYSIS_FROM_DATE: ${{ github.event.inputs.from_date }}
          ANALYSIS_TO_DATE: ${{ github.event.inputs.to_date }}
        run: |
          set -o pipefail
          python -u analysis/rank_stocks_by_strategy.py | tee analysis/output/rank_stocks_log.txt

      # [2026-08追加] heuristicsスコア（webapp-backendリポジトリの app/heuristics_scoring.py）
      # ベースの売買シミュレーション。「スコア上位N銘柄だけ売買」「スコアが一定以上の銘柄を売買」を、
      # 出来高・売買代金のしきい値フィルタや空売り（downスコア）も含めて総当たりで検証する。
      - name: Run score-based trade simulation (top-N / threshold / volume・trading-value filters)
        env:
          ANALYSIS_FROM_DATE: ${{ github.event.inputs.from_date }}
          ANALYSIS_TO_DATE: ${{ github.event.inputs.to_date }}
        run: |
          set -o pipefail
          python -u analysis/simulate_trades_by_score.py | tee analysis/output/simulate_trades_by_score_log.txt

      # [2026-08追加] analyze_heuristics_signals_by_volume.py（出来高層別検定）で
      # 「出来高急増時に限り一貫してプラス」だったTECH_*（TECH_HEAD_AND_SHOULDERS・
      # TECH_MOMIAI等）について、勝率だけでなく期待値（プロフィットファクター等）も
      # あわせて検証する。対象は analysis/simulate_trades_combo_volume.py 内の
      # TARGET_COMBOS で管理する。
      - name: Run targeted TECH_* x volume-bucket simulation (win_rate + profit_factor)
        env:
          ANALYSIS_FROM_DATE: ${{ github.event.inputs.from_date }}
          ANALYSIS_TO_DATE: ${{ github.event.inputs.to_date }}
        run: |
          set -o pipefail
          python -u analysis/simulate_trades_combo_volume.py | tee analysis/output/simulate_trades_combo_volume_log.txt

      - name: Upload simulation results
        uses: actions/upload-artifact@v4
        with:
          name: heuristics-trade-simulation-${{ github.event.inputs.from_date || 'all' }}-${{ github.event.inputs.to_date || 'all' }}-${{ github.run_id }}
          path: analysis/output/
          retention-days: 30
