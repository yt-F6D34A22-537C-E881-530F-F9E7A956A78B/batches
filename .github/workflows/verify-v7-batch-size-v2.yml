name: 【verify-v7-batch-size-v2.yml】Re-investigate v7/finance/quote batch size limit with relaxed criteria (案3検証・使い捨てその3)

# 責務: 前回の検証（verify-v7-batch-size.yml）で size=1500 のときに
#       returned=1499（1件だけ不足）となり打ち切られたが、これは
#       「バッチ上限」ではなく「特定の1銘柄がYahoo側で解決できなかった」
#       だけの可能性が高いという仮説を検証する。
#       判定基準を「HTTPステータスが200か」のみに緩め、1500件を超える
#       範囲（2000, 3000, 全銘柄）まで試す。あわせて、どの銘柄が
#       欠落したのかも特定して報告する。
#       本番のfetch.js・main.py・他ワークフローには一切影響しない。
#       検証が終わったらこのファイルごと削除して問題ない。

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-save xlsx

      - name: Write verification script
        run: |
          cat > verify_v7_batch_size_v2.mjs << 'SCRIPT_EOF'
          import xlsx from "xlsx";

          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36";

          function cookieHeaderFrom(setCookieArray) {
            return (setCookieArray || []).map(sc => sc.split(";")[0]).join("; ");
          }

          async function getCrumb() {
            const cookieRes = await fetch("https://fc.yahoo.com", { headers: { "User-Agent": UA }, redirect: "manual" });
            const setCookies = typeof cookieRes.headers.getSetCookie === "function"
              ? cookieRes.headers.getSetCookie()
              : [cookieRes.headers.get("set-cookie")].filter(Boolean);
            const cookie = cookieHeaderFrom(setCookies);
            if (!cookie) return null;

            const crumbRes = await fetch("https://query2.finance.yahoo.com/v1/test/getcrumb", {
              headers: { "User-Agent": UA, Cookie: cookie },
            });
            const crumb = (await crumbRes.text()).trim();
            if (!crumb || crumb.includes("<html") || crumbRes.status !== 200) return null;
            return { crumb, cookie };
          }

          async function tryBatch(codes, auth) {
            const symbols = codes.map(c => `${c}.T`).join(",");
            const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${encodeURIComponent(symbols)}&crumb=${encodeURIComponent(auth.crumb)}`;
            const started = Date.now();
            const res = await fetch(url, { headers: { "User-Agent": UA, Cookie: auth.cookie } });
            const elapsedMs = Date.now() - started;
            const text = await res.text();
            let json = null;
            try { json = JSON.parse(text); } catch { /* noop */ }
            const results = json?.quoteResponse?.result || [];
            const returnedSymbols = new Set(results.map(r => r.symbol));
            const missing = codes.map(c => `${c}.T`).filter(s => !returnedSymbols.has(s));
            return {
              requested: codes.length,
              returned: results.length,
              status: res.status,
              urlLength: url.length,
              elapsedMs,
              missing,
              errorMsg: json?.quoteResponse?.error || (res.status !== 200 ? text.slice(0, 200) : null),
            };
          }

          async function main() {
            const workbook = xlsx.readFile("data/data_j.xlsx");
            const sheet = workbook.Sheets["Sheet1"];
            const rows = xlsx.utils.sheet_to_json(sheet);
            const allCodes = rows.map(r => String(r["コード"]).trim()).filter(code => code && code !== "undefined");
            console.log(`data_j.xlsx から読み込んだ銘柄数: ${allCodes.length}`);

            const auth = await getCrumb();
            if (!auth) {
              console.log("crumb取得に失敗しました。検証を中断します。");
              return;
            }
            console.log(`crumb取得成功: "${auth.crumb}"`);

            // 判定基準は「HTTPステータスが200か」のみに緩める。
            // 個々の欠落銘柄（上場廃止等でYahoo側が解決できない銘柄）は
            // missingとして報告するが、打ち切り条件にはしない。
            const batchSizes = [1500, 2000, 3000, allCodes.length];
            console.log("\n========================================");
            console.log("バッチサイズごとの結果（判定基準: HTTPステータスのみ）");
            console.log("========================================");

            for (const size of batchSizes) {
              if (size > allCodes.length) continue;
              const codes = allCodes.slice(0, size);
              const result = await tryBatch(codes, auth);
              console.log(
                `size=${result.requested.toString().padStart(5)} | status=${result.status} | ` +
                `returned=${result.returned.toString().padStart(5)} | missing=${result.missing.length} | ` +
                `urlLength=${result.urlLength} | elapsed=${result.elapsedMs}ms` +
                (result.errorMsg ? ` | error=${JSON.stringify(result.errorMsg)}` : "")
              );
              if (result.missing.length > 0 && result.missing.length <= 10) {
                console.log(`  欠落銘柄: ${result.missing.join(", ")}`);
              } else if (result.missing.length > 10) {
                console.log(`  欠落銘柄（先頭10件）: ${result.missing.slice(0, 10).join(", ")}`);
              }

              if (result.status !== 200) {
                console.log(`\n→ size=${size} でHTTPステータスが200以外になりました。ここが実質的な上限です。`);
                break;
              }

              await new Promise(r => setTimeout(r, 1000));
            }
          }

          main().catch(err => {
            console.error("ERROR:", err);
            process.exit(1);
          });
          SCRIPT_EOF

      - name: Run verification script
        run: node verify_v7_batch_size_v2.mjs | tee verify_result.txt

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### v7/finance/quote バッチサイズ上限 再検証結果（判定基準を緩和）"
            echo '```'
            cat verify_result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
