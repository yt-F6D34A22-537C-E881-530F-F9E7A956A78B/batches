name: 【heuristics.yml】Generate heuristics_YYYYMMDD.json (経験則スクリーニング)

on:
  schedule:
    # - cron: "7 23 * * *"  # JST 08:07（fetch の 1 時間後）
    - cron: "7 8 * * *"   # JST 17:07（fetch の 1 時間後）
    - cron: "7 10 * * *"  # JST 19:07（fetch の 1 時間後）
    - cron: "7 12 * * *"  # JST 21:07（fetch の 1 時間後）
  workflow_dispatch:
    inputs:
      date:
        description: "単一日指定（YYYYMMDD）。from_date / to_date と同時使用不可。省略時は通常処理。"
        required: false
        default: ""
      from_date:
        description: "期間指定・開始日（YYYYMMDD）。to_date と必ずペアで指定。"
        required: false
        default: ""
      to_date:
        description: "期間指定・終了日（YYYYMMDD）。from_date と必ずペアで指定。"
        required: false
        default: ""

permissions:
  contents: write

# 複数のworkflowの同時実行を禁止
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  generate_heuristics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← stale info（古い main）を防ぐため必須

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-save node-fetch@3 xlsx

      - name: Ensure data directory exists
        run: |
          mkdir -p data
          mkdir -p data/backup
          mkdir -p data/heuristics

      - name: Run heuristics script
        run: |
          # 実行引数を組み立てる
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          elif [ -n "${{ github.event.inputs.from_date }}" ] && [ -n "${{ github.event.inputs.to_date }}" ]; then
            ARGS="--from ${{ github.event.inputs.from_date }} --to ${{ github.event.inputs.to_date }}"
          fi
          echo "heuristics.js 実行引数: ${ARGS:-（なし: 通常モード）}"
          if [ -n "${ARGS}" ]; then
            node scripts/heuristics.js ${ARGS}
          else
            node scripts/heuristics.js
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/heuristics/**/heuristics_*.json data/backup/

          git commit -m "Update heuristics_YYYYMMDD.json and backup" || exit 0

          git push origin main || (
            echo "Push rejected. Fetching latest main..."

            echo "=== Git status ==="
            git status

            echo "=== HEAD ==="
            git rev-parse HEAD

            echo "=== origin/main ==="
            git ls-remote origin refs/heads/main

            echo "=== Recent commits ==="
            git log --oneline --decorate -5

            git fetch origin
            git rebase -X theirs origin/main
            git push origin main
          )
