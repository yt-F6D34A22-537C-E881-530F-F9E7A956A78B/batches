name: 【heuristics.yml】Generate heuristics_YYYYMMDD.json (経験則スクリーニング)

on:
  schedule:
    # - cron: "7 23 * * *"  # JST 08:07（fetch の 1 時間後）
    - cron: "7 8 * * *"   # JST 17:07（fetch の 1 時間後）
    - cron: "7 10 * * *"  # JST 19:07（fetch の 1 時間後）
    - cron: "7 12 * * *"  # JST 21:07（fetch の 1 時間後）
  workflow_dispatch:

permissions:
  contents: write

# 複数のworkflowの同時実行を禁止
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  heuristics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← stale info（古い main）を防ぐため必須

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-save node-fetch@3 xlsx

      - name: Ensure data directory exists
        run: |
          mkdir -p data
          mkdir -p data/backup
          mkdir -p data/heuristics

      - name: Run heuristics script
        run: node scripts/heuristics.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/heuristics/**/heuristics_*.json data/backup/

          git commit -m "Update heuristics_YYYYMMDD.json and backup" || exit 0

          git push origin main || (
            echo "Push rejected. Fetching latest main..."

            echo "=== Git status ==="
            git status

            echo "=== HEAD ==="
            git rev-parse HEAD

            echo "=== origin/main ==="
            git ls-remote origin refs/heads/main

            echo "=== Recent commits ==="
            git log --oneline --decorate -5

            git fetch origin
            git rebase origin/main
            git push origin main
          )
