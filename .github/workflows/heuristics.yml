name: 【heuristics.yml】Generate heuristics_YYYYMMDD.json (経験則スクリーニング)

on:
  schedule:
    # - cron: "0 0 * * *"  # JST 09:00（fetch の 2 時間後）
    - cron: "0 9 * * *"   # JST 18:00（fetch の 2 時間後）
    - cron: "0 11 * * *"  # JST 20:00（fetch の 2 時間後）
    - cron: "0 13 * * *"  # JST 22:00（fetch の 2 時間後）
  workflow_dispatch:

permissions:
  contents: write

# 複数のworkflowの同時実行を禁止
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  heuristics:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← stale info（古い main）を防ぐため必須

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install node-fetch@3 xlsx

      - name: Ensure data directory exists
        run: |
          mkdir -p data
          mkdir -p data/backup
          mkdir -p data/heuristics

      - name: Run heuristics script
        run: node scripts/heuristics.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git pull --rebase origin main
          git add data/heuristics/**/heuristics_*.json data/backup/ || true
          git commit -m "Update heuristics_YYYYMMDD.json and backup" || echo "No changes"
          git push origin main
