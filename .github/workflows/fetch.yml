name: 【fetch.yml】Fetch Yahoo Finance Chart Data

on:
  schedule:
    - cron: "0 22 * * *"  # JST 07:00 = UTC 22:00（前日）
    - cron: "0 7 * * *"   # JST 16:00 = UTC 07:00
    - cron: "0 9 * * *"   # JST 18:00 = UTC 09:00
    - cron: "0 11 * * *"  # JST 20:00 = UTC 11:00
  workflow_dispatch:

permissions:
  contents: write

# 複数のworkflowの同時実行を禁止
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ← stale info（古い main）を防ぐため必須

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install node-fetch@3 xlsx

      - name: Ensure data directory exists
        run: |
          mkdir -p data

      - name: Run fetch script
        run: node scripts/fetch.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/data.json data/backup/

          git commit -m "Update data.json and backup" || exit 0

          git push origin main || (
            echo "Push rejected. Fetching latest main..."

            echo "=== Git status ==="
            git status

            echo "=== HEAD ==="
            git rev-parse HEAD

            echo "=== origin/main ==="
            git ls-remote origin refs/heads/main

            echo "=== Recent commits ==="
            git log --oneline --decorate -5

            git fetch origin
            git rebase origin/main
            git push origin main
          )
